<title>Unicorn Stable</title>
<style>
:root{
  --plum:#4a2c6b; --pink:#ff6fae; --pink-soft:#ffd6ea; --sky:#8fd3ff; --butter:#ffe07a;
  --mint:#7fe0c3; --cream:#fff6fb; --lilac:#efe4ff; --white:#ffffff;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--plum);
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Nunito","Trebuchet MS",system-ui,sans-serif;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--pink);outline-offset:3px}

#app{height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr auto;gap:10px;
  padding-block:10px;padding-inline:16px;max-width:1400px;margin:0 auto}

/* top bar */
#bar{display:flex;gap:10px;align-items:stretch}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:22px;
  background:var(--white);padding:6px 10px;min-height:64px;box-shadow:0 4px 0 rgba(74,44,107,.14);
  font-weight:800;font-size:18px;letter-spacing:.02em;transition:transform .15s,background .15s}
.tab svg{width:46px;height:46px;flex:none}
.tab.on{background:var(--pink);color:var(--white);box-shadow:0 4px 0 #d94b8c;transform:translateY(-2px)}
.tab:active{transform:translateY(2px)}
.tab.nudge{animation:nudge 1s ease-in-out 3}
@keyframes nudge{50%{transform:scale(1.1) rotate(-3deg)}}
#mute{flex:none;width:64px;border:0;border-radius:22px;background:var(--white);box-shadow:0 4px 0 rgba(74,44,107,.14);display:grid;place-items:center}
#mute svg{width:34px;height:34px}

/* stage */
#stage{position:relative;border-radius:28px;overflow:hidden;min-height:0;touch-action:none;
  box-shadow:inset 0 0 0 4px var(--white),0 6px 0 rgba(74,44,107,.12);background:var(--lilac)}
.scene{position:absolute;inset:0}
#sceneMake{background:radial-gradient(120% 80% at 50% 105%,#fff 0 22%,transparent 23%),linear-gradient(#ffe0f0,#e6dcff 70%,#dff3ff)}
#sceneMake .tw{position:absolute;color:#fff;font-size:26px;animation:tw 2.4s ease-in-out infinite;text-shadow:0 0 8px #fff}
@keyframes tw{50%{transform:scale(.4) rotate(40deg);opacity:.35}}
.pedestal{position:absolute;left:50%;bottom:1%;width:62%;height:14%;transform:translateX(-50%);
  background:radial-gradient(closest-side,#fff 0 70%,rgba(255,255,255,0));filter:drop-shadow(0 4px 0 rgba(143,211,255,.45))}

#sceneStable{background:repeating-linear-gradient(90deg,#f5c9a6 0 70px,#e7b08b 70px 74px)}
.hay{position:absolute;left:0;right:0;bottom:0;height:24%;border-top:7px solid #e0ad45;
  background:repeating-linear-gradient(100deg,#f8dc80 0 7px,#eec65a 7px 10px,#fae391 10px 18px)}
.window{position:absolute;top:7%;right:5%;width:20%;aspect-ratio:1.25;max-width:100%;border:10px solid #c78a60;border-radius:18px;
  background:linear-gradient(#9fdcff,#dcf3ff);overflow:hidden;transition:background 1.5s}
.window::before,.window::after{content:"";position:absolute;background:#c78a60}
.window::before{left:calc(50% - 4px);top:0;bottom:0;width:8px}
.window::after{top:calc(50% - 4px);left:0;right:0;height:8px}
.window i{position:absolute;left:12%;top:20%;width:40%;height:24%;border-radius:40px;background:#fff;box-shadow:18px 6px 0 -4px #fff;opacity:.9}
.plaque{position:absolute;top:5%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  background:#b8764f;border:5px solid #8b5433;border-radius:16px;padding:6px 22px;color:#fff4d6;font-weight:900;
  font-size:clamp(20px,3.2vw,34px);letter-spacing:.03em;white-space:nowrap;box-shadow:0 5px 0 rgba(74,44,107,.18)}
.plaque svg{width:1.1em;height:1.1em}
.trophies{position:absolute;top:6%;left:3%;display:flex;flex-direction:column;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 14px 4px 8px;
  font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(74,44,107,.12)}
.chip b{font-size:24px}

#needs{position:absolute;left:3%;top:50%;transform:translateY(-35%);display:flex;flex-direction:column;gap:12px;z-index:3}
.need{width:66px;height:66px;border-radius:50%;border:0;padding:6px;box-shadow:0 4px 0 rgba(74,44,107,.15);
  background:conic-gradient(var(--c,#5ce08a) calc(var(--v,50)*1%),rgba(255,255,255,.6) 0)}
.need span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#fff;font-size:28px}
.need.low{animation:nudge 1.4s ease-in-out infinite}

#night{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s;
  background:radial-gradient(circle at 85% 18%,rgba(255,244,190,.9) 0 3.5%,rgba(255,244,190,0) 7%),rgba(22,18,78,.64);z-index:2}
#night i{position:absolute;color:#fff7c2;font-style:normal;font-size:18px;animation:tw 2s ease-in-out infinite}
#stage.night #night{opacity:1}
#stage.night .window{background:linear-gradient(#1c1b5a,#3b3490)}

#uniWrap{position:absolute;left:50%;bottom:3%;width:90%;height:80%;transform:translateX(-50%);z-index:1}
#stage[data-mode="stable"] #uniWrap{left:55%;width:78%;height:66%;bottom:6%}
#uniWrap svg{width:100%;height:100%;display:block;pointer-events:none;overflow:visible}
#uniWrap svg .bob{pointer-events:visiblePainted;cursor:pointer}
#uniWrap.hop svg{animation:hop .55s ease-out}
@keyframes hop{40%{transform:translateY(-12%)}}
#uniWrap.munch svg{animation:munch .3s ease-in-out 3;transform-origin:80% 100%}
@keyframes munch{50%{transform:rotate(-2.5deg)}}
#uniWrap.shake svg{animation:shake .5s ease-in-out}
@keyframes shake{25%{transform:translateX(-3%)}75%{transform:translateX(3%)}}
#uniWrap.shine svg{animation:shine 1.2s ease-in-out 2}
@keyframes shine{50%{filter:drop-shadow(0 0 18px #fff) brightness(1.08)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.tail{transform-box:view-box;transform-origin:80px 130px;animation:sway 2.6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(6deg)}}
.wing{transform-box:view-box;transform-origin:160px 124px;animation:flap 1.6s ease-in-out infinite}
@keyframes flap{50%{transform:rotate(-10deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

#thought{position:absolute;z-index:3;background:#fff;border-radius:50%;width:74px;height:74px;display:grid;place-items:center;
  font-size:36px;box-shadow:0 4px 0 rgba(74,44,107,.14);animation:float 2s ease-in-out infinite;pointer-events:none}
#thought::after{content:"";position:absolute;right:-6px;bottom:-12px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:10px 12px 0 -4px #fff}
@keyframes float{50%{transform:translateY(-6px)}}

#fly{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#done{position:absolute;top:14px;right:14px;z-index:5;width:66px;height:66px;border-radius:50%;border:0;background:#fff;
  box-shadow:0 4px 0 rgba(74,44,107,.18);display:grid;place-items:center}
#done svg{width:34px;height:34px}

/* panel */
#panel{background:var(--white);border-radius:26px;padding:12px;box-shadow:0 5px 0 rgba(74,44,107,.1);display:grid;gap:10px}
#cats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cat{width:64px;height:58px;border:0;border-radius:18px;background:var(--lilac);display:grid;place-items:center;padding:4px}
.cat svg{width:40px;height:40px}
.cat .em{font-size:30px;line-height:1}
.cat.on{background:var(--butter);box-shadow:inset 0 0 0 3px #f2b52e}
#opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.opt{width:68px;height:68px;border-radius:50%;border:4px solid #fff;padding:0;display:grid;place-items:center;
  box-shadow:0 0 0 2px #e4d6f5,0 4px 0 rgba(74,44,107,.14);background:#fff;transition:transform .15s}
.opt svg{width:52px;height:52px}
.opt.on{box-shadow:0 0 0 5px var(--pink),0 4px 0 rgba(74,44,107,.14);transform:scale(1.08)}
.opt.name{border-radius:20px;width:84px;height:78px;display:flex;flex-direction:column;gap:2px;justify-content:center}
.opt.name .em{font-size:32px;line-height:1}
.opt.name small{font-size:12px;font-weight:800}
#care{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.care{width:78px;height:78px;border:0;border-radius:24px;background:var(--lilac);font-size:40px;display:grid;place-items:center;
  box-shadow:0 4px 0 rgba(74,44,107,.14);transition:transform .15s}
.care svg{width:48px;height:48px}
.care:active{transform:scale(.92)}
.care.food{background:#ffe9d6}.care.wash{background:#dff1ff}.care.rest{background:#e6e0ff}
.care.nudge{animation:nudge 1s ease-in-out 3}
.care:disabled{opacity:.45}
.sep{width:3px;border-radius:3px;background:#efe6f8}

/* fx layer */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.p{position:absolute;width:0;height:0}
.p>i{position:absolute;transform:translate(-50%,-50%);font-style:normal;line-height:1;white-space:nowrap}
.bub{display:block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,rgba(190,230,255,.55) 40%,rgba(143,211,255,.25));border:2px solid rgba(255,255,255,.9)}
.zz{font-weight:900;color:#fff7c2;text-shadow:0 2px 0 #3b3490}
#tool{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%);font-size:70px;line-height:1;filter:drop-shadow(0 4px 2px rgba(74,44,107,.25))}
#tool svg{width:84px;height:84px}

/* start */
#start{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(255,246,251,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#go{width:160px;height:160px;border-radius:50%;border:8px solid #fff;background:var(--pink);box-shadow:0 8px 0 #d94b8c,0 0 0 14px rgba(255,111,174,.25);
  display:grid;place-items:center;animation:pulse 1.6s ease-in-out infinite}
#go svg{width:70px;height:70px;margin-left:10px}
@keyframes pulse{50%{transform:scale(1.07)}}

@media (max-width:620px){
  .tab span{display:none} .tab{min-height:56px} .tab svg{width:40px;height:40px}
  .need{width:54px;height:54px}.need span{font-size:22px}
  .care{width:62px;height:62px;font-size:32px}.care svg{width:38px;height:38px}
  .opt{width:56px;height:56px}.opt svg{width:42px;height:42px}
  .opt.name{width:70px;height:70px}
  .cat{width:52px;height:50px}
  .plaque{font-size:18px;padding:4px 14px}
  .chip{font-size:15px}.chip b{font-size:18px}
  .sep{display:none}
  #stage[data-mode="stable"] #uniWrap{left:60%;width:76%}
}
@media (prefers-reduced-motion:reduce){
  .bob,.tail,.wing,#sceneMake .tw,#go,#thought{animation:none}
}
</style>

<div id="app">
  <header id="bar">
    <button class="tab" id="tab-make" data-m="make" aria-label="Make your unicorn">
      <svg viewBox="0 0 48 48"><rect x="8" y="22" width="30" height="7" rx="3.5" transform="rotate(-40 23 25)" fill="#8f5fd6"/><polygon points="36,4 39,11 46,12 41,17 42,24 36,20 30,24 31,17 26,12 33,11" fill="#ffd34d" stroke="#f0a51c" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.5" fill="#ff8cc6"/><circle cx="42" cy="36" r="2" fill="#8fd3ff"/></svg>
      <span>Make</span></button>
    <button class="tab" id="tab-stable" data-m="stable" aria-label="Unicorn stable">
      <svg viewBox="0 0 48 48"><path d="M6,22 L24,6 L42,22 L42,44 L6,44Z" fill="#ff7a8a" stroke="#d94b6a" stroke-width="2" stroke-linejoin="round"/><rect x="16" y="26" width="16" height="18" rx="2" fill="#fff4d6"/><path d="M16,26 L32,44 M32,26 L16,44" stroke="#d94b6a" stroke-width="2.5"/><path d="M4,23 L24,5 L44,23" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
      <span>Stable</span></button>
    <button class="tab" id="tab-fly" data-m="fly" aria-label="Fly">
      <svg viewBox="0 0 48 48"><g fill="none" stroke-width="4.5"><path d="M4,34 A20,20 0 0 1 44,34" stroke="#ff5d73"/><path d="M8.5,34 A15.5,15.5 0 0 1 39.5,34" stroke="#ffd93d"/><path d="M13,34 A11,11 0 0 1 35,34" stroke="#4cc3ff"/></g><g fill="#fff" stroke="#c9d9ea" stroke-width="1.5"><circle cx="8" cy="36" r="5"/><circle cx="14" cy="34" r="6"/><circle cx="36" cy="36" r="5"/><circle cx="41" cy="34" r="6"/></g></svg>
      <span>Fly</span></button>
    <button id="mute" aria-label="Sound on or off"></button>
  </header>

  <main id="stage" data-mode="make">
    <div class="scene" id="sceneMake">
      <i class="tw" style="left:8%;top:14%">✦</i><i class="tw" style="left:22%;top:40%;animation-delay:.6s">✦</i>
      <i class="tw" style="left:80%;top:12%;animation-delay:1.1s">✦</i><i class="tw" style="left:90%;top:48%;animation-delay:.3s">✦</i>
      <i class="tw" style="left:60%;top:8%;animation-delay:1.6s">✦</i><i class="tw" style="left:36%;top:10%;animation-delay:.9s">✦</i>
      <div class="pedestal"></div>
    </div>
    <div class="scene" id="sceneStable" hidden>
      <div class="window"><i></i></div>
      <div class="hay"></div>
      <div class="plaque"><svg viewBox="0 0 24 24"><path d="M6,20 C1,12 4,3 12,3 C20,3 23,12 18,20" fill="none" stroke="#ffd34d" stroke-width="4.5" stroke-linecap="round"/><g fill="#8b5433"><circle cx="5.2" cy="12" r="1"/><circle cx="18.8" cy="12" r="1"/><circle cx="8" cy="6.2" r="1"/><circle cx="16" cy="6.2" r="1"/></g></svg><span id="plaqueName">Cupcake</span></div>
      <div class="trophies"><div class="chip"><b>⭐</b><span id="starCount">0</span></div><div class="chip"><b>🌈</b><span id="rainbowCount">0</span></div></div>
    </div>
    <div id="night"><i style="left:12%;top:10%">★</i><i style="left:30%;top:22%;animation-delay:.7s">★</i><i style="left:55%;top:8%;animation-delay:1.3s">★</i><i style="left:70%;top:30%;animation-delay:.4s">★</i><i style="left:44%;top:34%;animation-delay:1s">★</i></div>
    <div id="uniWrap"></div>
    <div id="needs" hidden></div>
    <div id="thought" hidden></div>
    <canvas id="fly" hidden></canvas>
    <button id="done" hidden aria-label="Stop"><svg viewBox="0 0 24 24"><path d="M5,5 L19,19 M19,5 L5,19" stroke="#4a2c6b" stroke-width="3.5" stroke-linecap="round"/></svg></button>
  </main>

  <section id="panel">
    <div id="makePanel"><div id="cats"></div><div id="opts" style="margin-top:10px"></div></div>
    <div id="care" hidden></div>
  </section>
</div>
<div id="fx"></div>
<div id="tool" hidden></div>
<div id="start"><button id="go" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M5,3 L21,12 L5,21Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></button></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- colors ---------- */
const hex2rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const rgb2hex=r=>'#'+r.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((v,i)=>v+(B[i]-v)*t))};
const shade=(c,t)=>mix(c,'#3a2352',t), tint=(c,t)=>mix(c,'#ffffff',t);
const lum=c=>{const [r,g,b]=hex2rgb(c);return (0.299*r+0.587*g+0.114*b)/255};

const RAINBOW=['#ff5d73','#ff9f43','#ffd93d','#5ce08a','#4cc3ff','#9b7bff'];
const SKY7=[['#ff4d6d','Red'],['#ff9f43','Orange'],['#ffd93d','Yellow'],['#5ce08a','Green'],['#4cc3ff','Blue'],['#9b6bff','Purple'],['#ff7ec3','Pink']];
const BODY=[['#fdfaff','White'],['#ffc7df','Pink'],['#dccbff','Purple'],['#c3e4ff','Blue'],['#c8f3de','Mint green'],['#fff0a6','Yellow'],['#ffd3b5','Peach'],['#5d5b92','Midnight blue']];
const MANE=[['rainbow','Rainbow'],['candy','Cotton candy'],['#ff7eb6','Pink'],['#a36bff','Purple'],['#4fa8ff','Blue'],['#2fcfae','Green'],['#ffc53d','Gold'],['#ffffff','White']];
const HORN={gold:{f:'#ffd34d',s:['#f0a51c'],say:'Gold'},rainbow:{f:'#ffffff',s:RAINBOW,say:'Rainbow'},pink:{f:'#ffb3d9',s:['#ff5fa8'],say:'Pink'},pearl:{f:'#f6f2ff',s:['#c6b8ff'],say:'Pearl'},crystal:{f:'#c9f3ff',s:['#6cc6ef'],say:'Crystal'}};
const WINGS=[['none','No wings'],['white','White wings'],['pink','Pink wings'],['gold','Gold wings'],['fairy','Fairy wings']];
const WINGC={white:'#ffffff',pink:'#ffc9e3',gold:'#ffe28a'};
const MARKS=[['star','Star'],['heart','Heart'],['moon','Moon'],['flower','Flower'],['rainbow','Rainbow'],['sparkle','Sparkle']];
const NAMES=[['⭐','Starlight'],['🧁','Cupcake'],['🌈','Rainbow'],['🌙','Moonbeam'],['🌸','Blossom'],['💖','Lovey'],['❄️','Snowflake'],['☀️','Sunny'],['🍓','Berry']];
const OUT='#5b3a7e';

/* ---------- state ---------- */
const KEY='unicorn-stable-v1';
const DEF={look:{body:'#fdfaff',mane:'rainbow',horn:'gold',wings:'none',mark:'star',name:'Cupcake',icon:'🧁'},
  needs:{food:70,clean:70,fun:70,rest:80},t:Date.now(),stars:0,stripes:0,rainbows:0,muted:false,made:false};
function load(){
  const d=JSON.parse(JSON.stringify(DEF));
  try{const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&s.look){Object.assign(d,s);d.look=Object.assign({},DEF.look,s.look);d.needs=Object.assign({},DEF.needs,s.needs)}}catch(e){}
  const h=clamp((Date.now()-(d.t||Date.now()))/3.6e6,0,72);
  const n=d.needs; n.food-=h*5;n.clean-=h*3;n.fun-=h*4;n.rest-=h*3;
  for(const k in n)n[k]=clamp(n[k],15,100);
  d.t=Date.now();return d;
}
const S=load();
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const nm=()=>S.look.name;

/* ---------- audio ---------- */
let AC=null;
function unlock(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,d=.2,type='sine',v=.2,t0=0,f2){
  if(S.muted||!AC)return;
  const t=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);
}
function noise(d=.07,v=.15,t0=0,freq=1500){
  if(S.muted||!AC)return;
  const t=AC.currentTime+t0,len=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,len,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;g.gain.value=v;
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
}
const PENTA=[523,587,659,784,880,1047,1175,1319,1568,1760];
const sfx={
  chime(i=0){const f=PENTA[i%PENTA.length];tone(f,.4,'sine',.18);tone(f*2,.3,'triangle',.05,.02)},
  pick(){tone(660,.14,'triangle',.15);tone(990,.2,'triangle',.12,.08);tone(1320,.25,'sine',.06,.16)},
  pop(){tone(420,.12,'sine',.22,0,1500)},
  crunch(){noise(.07,.25,0,1900);noise(.07,.22,.17,1500);noise(.07,.2,.34,1800)},
  boing(){tone(200,.4,'sine',.22,0,560)},
  squeak(){tone(1300+Math.random()*500,.06,'sine',.045)},
  brush(){noise(.05,.08,0,4200)},
  whoosh(){noise(.35,.12,0,700)},
  whinny(){
    if(S.muted||!AC)return;

    l.frequency.value=12;lg.gain.value=70;l.connect(lg);lg.connect(o.frequency);
    f.type='lowpass';f.frequency.value=2200;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.85);
    o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);l.start(t);o.stop(t+.9);l.stop(t+.9);
  },
  fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.16,i*.12));[1047,1319,1568].forEach(f=>tone(f,.9,'sine',.08,.5))},
  lullaby(){const N=[523,523,784,784,880,880,784,698,698,659,659,587,587,523];
    N.forEach((f,i)=>{const t=i*.55+(i===6||i===13?0:0);tone(f,.7,'sine',.09,t);tone(f/2,.7,'triangle',.03,t)})},

  const s=document.createElement('span');s.className='p';s.style.left=sx+'px';s.style.top=sy+'px';
  s.innerHTML=`<i style="font-size:46px">${btn.textContent}</i>`;FXL.appendChild(s);sfx.whoosh();
  const an=s.animate([{transform:'translate(0,0)'},{transform:`translate(${dx*.5}px,${dy*.5-140}px) rotate(180deg)`},{transform:`translate(${dx}px,${dy}px) rotate(360deg) scale(.5)`}],{duration:750,easing:'ease-in-out'});
  an.onfinish=()=>{
    s.remove();sfx.crunch();flash('munch',950);
    burst(m.x,m.y,kind==='cupcake'?['💖','✨','🎉']:['💖','✨'],kind==='cupcake'?12:7,90);
    if(kind==='cupcake'){bump('food',15);bump('fun',12);speak(pick(['Mmm, a cupcake! Yummy!','Sweet treat! Thank you!']))}
    else{bump('food',25);speak(pick(['Yum yum!','Crunchy! Thank you!','Mmm, delicious!','Munch munch munch!']))}
    setTimeout(()=>{feeding=false;sfx.whinny()},900);
  };
}

/* ---------- rub games (bath, brush) ---------- */
const MUD=[[105,140],[140,128],[178,138],[150,168],[200,160],[128,204],[224,206],[256,80],[210,104],[92,154]];
const KNOT=[[38,166],[54,184],[72,204],[28,138],[203,108],[214,72],[230,46]];
function startRub(type){
  if(mode!=='stable')return;
  act={type,spots:[],rubbing:false,last:null,n:0};
  eyes='open';drawUni();
  const g=UW.querySelector('#act'),pts=[...(type==='bath'?MUD:KNOT)].sort(()=>Math.random()-.5).slice(0,type==='bath'?7:6);
  pts.forEach(([x,y])=>{
    const ns='http://www.w3.org/2000/svg',el=document.createElementNS(ns,'g');
    el.innerHTML=type==='bath'
      ?`<circle cx="${x}" cy="${y}" r="11" fill="#8a5a3b"/><circle cx="${x+8}" cy="${y-5}" r="7" fill="#7a4b2f"/><circle cx="${x-7}" cy="${y+6}" r="6" fill="#9b6a47"/><circle cx="${x+3}" cy="${y+8}" r="3" fill="#7a4b2f"/>`
      :`<circle cx="${x}" cy="${y}" r="13" fill="#b8a9c4" opacity=".6"/><path d="M${x-10},${y} c4,-12 14,-8 10,2 c-4,10 -16,4 -10,-6 c6,-10 18,-2 12,8 c-4,6 -12,4 -12,-2" fill="none" stroke="#7d6a8c" stroke-width="3" stroke-linecap="round"/><path d="M${x-4},${y-9} c8,-2 10,8 2,10" fill="none" stroke="#7d6a8c" stroke-width="2.5" stroke-linecap="round"/>`;
    el.style.transition='opacity .2s';g.appendChild(el);act.spots.push({el,hp:5,max:5});
  });
  TOOL.innerHTML=type==='bath'?'🧽':BRUSH;TOOL.hidden=true;
  $('#done').hidden=false;setCareDisabled(true);refreshNeeds();
  speak(type==='bath'?`Uh oh, ${nm()} is muddy! Scrub scrub with the sponge!`:`${nm()} has tangles! Brush them out!`);
}
function endAct(){
  act=null;TOOL.hidden=true;$('#done').hidden=true;setCareDisabled(false);
  const g=UW.querySelector('#act');if(g)g.innerHTML='';
  refreshNeeds();
}
function rub(x,y){
  if(!act||!act.spots)return;
  TOOL.hidden=false;TOOL.style.left=x+'px';TOOL.style.top=y+'px';
  if(!act.rubbing)return;
  if(act.last&&Math.hypot(x-act.last.x,y-act.last.y)<9)return;
  act.last={x,y};act.n++;
  if(act.n%3===0){act.type==='bath'?sfx.squeak():sfx.brush()}
  if(act.type==='bath'&&act.n%2===0)fx(x+rnd(-30,30),y+rnd(-20,20),'<b class="bub"></b>',{dx:rnd(-30,30),dy:rnd(-90,-40),size:rnd(14,30),dur:1000});
  act.spots.forEach(s=>{
    if(s.hp<=0)return;
    const r=s.el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    if(Math.hypot(x-cx,y-cy)<Math.max(r.width,r.height)/2+34){
      s.hp--;s.el.style.opacity=(.3+.7*s.hp/s.max).toFixed(2);
      if(act.type==='brush'&&Math.random()<.5)fx(cx,cy,'✨',{dx:rnd(-40,40),dy:rnd(-60,-20),size:20,dur:700});
      if(s.hp<=0){
        sfx.pop();s.el.animate([{opacity:.3},{opacity:0}],{duration:250,fill:'forwards'});
        burst(cx,cy,act.type==='bath'?['<b class="bub"></b>','✨']:['✨','⭐'],7,70);
      }
    }
  });
  if(act.spots.every(s=>s.hp<=0)){
    const type=act.type;act.spots=null;act.rubbing=false;TOOL.hidden=true;
    setTimeout(()=>{
      sfx.fanfare();flash('shine',2400);
      const c=svgPt(165,100);burst(c.x,c.y,type==='bath'?['<b class="bub"></b>','✨','💖']:['✨','💖','⭐'],22,200);
      if(type==='bath'){bump('clean',100);speak(`Squeaky clean! ${nm()} is sparkly!`)}
      else{bump('clean',15);bump('fun',15);speak(`So pretty! ${nm()} loves you!`)}
      setTimeout(()=>{endAct();sfx.whinny()},1300);
    },250);
  }
}

/* ---------- sleep ---------- */
function sleep(){
  if(mode!=='stable')return;
  act={type:'sleep'};eyes='closed';drawUni();stage.classList.add('night');
  $('#done').hidden=false;setCareDisabled(true);refreshNeeds();
  speak(`Night night, ${nm()}. Sweet dreams.`);setTimeout(()=>{if(act&&act.type==='sleep')sfx.lullaby()},1600);
  const start=S.needs.rest;let t=0;
  act.timer=setInterval(()=>{
    t+=.5;S.needs.rest=clamp(start+(100-start)*t/9,0,100);refreshNeeds();
    if(t%1===0){const p=svgPt(262,30);fx(p.x+rnd(-6,6),p.y,'<b class="zz">Z</b>',{dx:rnd(30,70),dy:-110,size:rnd(22,36),dur:1800})}
    if(t>=9)wake(true);
  },500);
}
function wake(full){
  if(!act||act.type!=='sleep')return;
  clearInterval(act.timer);stage.classList.remove('night');eyes='open';drawUni();
  if(full){S.needs.rest=100;sfx.fanfare();speak(`Good morning, ${nm()}!`);const c=svgPt(250,40);burst(c.x,c.y,['☀️','✨','💖'],10,120)}
  save();endAct();
}
$('#done').onclick=()=>{unlock();if(act&&act.type==='sleep')wake(false);else endAct();sfx.pop()};

/* ---------- stage pointer ---------- */
stage.addEventListener('pointerdown',e=>{
  unlock();
  if(act&&act.spots){act.rubbing=true;act.last=null;try{stage.setPointerCapture(e.pointerId)}catch(_){}rub(e.clientX,e.clientY)}
});
stage.addEventListener('pointermove',e=>{if(act&&act.spots)rub(e.clientX,e.clientY)});
const endRub=()=>{if(act)act.rubbing=false};
stage.addEventListener('pointerup',endRub);stage.addEventListener('pointercancel',endRub);
stage.addEventListener('pointerleave',()=>{if(act&&act.spots&&!act.rubbing)TOOL.hidden=true});

let tickling=false;
UW.addEventListener('click',e=>{
  if(mode==='fly'||act||tickling||!e.target.closest('.bob'))return;
  unlock();tickling=true;eyes='happy';drawUni();flash('hop',600);sfx.whinny();
  burst(e.clientX,e.clientY,['💖','✨','💕'],9,100);
  speak(pick(['Hee hee hee!','That tickles!','I love you!','Neigh! Hee hee!','Wheee!']));
  if(mode==='stable')bump('fun',8);
  setTimeout(()=>{tickling=false;if(!act){eyes='open';drawUni()}},1100);
});

/* ---------- fly ---------- */
const CV=$('#fly'),F={on:false};
function flySize(){
  const r=stage.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);
  F.W=r.width;F.H=r.height;F.dpr=d;CV.width=Math.round(r.width*d);CV.height=Math.round(r.height*d);
  F.uw=clamp(F.W*.24,110,250);F.uh=F.uw*260/320;
}
function flyStart(){
  flySize();F.ctx=CV.getContext('2d');
  F.img=new Image();F.img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(uniSVG(S.look,{static:true}));
  Object.assign(F,{stars:[],clouds:[],parts:[],trail:[],spawn:.4,cspawn:2,count:0,cele:0,t:0,
    ux:F.W*.28,uy:F.H*.55,tx:F.W*.28,ty:F.H*.55,last:performance.now(),on:true});
  F.bg=Array.from({length:6},()=>({x:rnd(0,F.W),y:rnd(F.H*.1,F.H*.8),w:rnd(80,160),s:rnd(.02,.05)}));
  requestAnimationFrame(flyLoop);
  speak(S.stripes?`Let's fly, ${nm()}! Catch more stars for the rainbow!`:`Let's fly! Catch the stars to make a rainbow!`);
}
function flyStop(){F.on=false}
function flyPointer(e){
  const r=CV.getBoundingClientRect();F.tx=e.clientX-r.left;F.ty=e.clientY-r.top-F.uh*.3;
}
CV.addEventListener('pointerdown',e=>{unlock();flyPointer(e);try{CV.setPointerCapture(e.pointerId)}catch(_){}});
CV.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pressure>0)flyPointer(e)});

function drawStar(c,x,y,R,rot,fill,stroke){
  c.save();c.translate(x,y);c.rotate(rot);c.beginPath();
  for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,d=i%2?R*.45:R;c.lineTo(Math.cos(a)*d,Math.sin(a)*d)}
  c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.lineWidth=2.5;c.strokeStyle=stroke;c.lineJoin='round';c.stroke()}c.restore();
}
function drawCloud(c,x,y,w,a){
  c.globalAlpha=a;c.fillStyle='#fff';c.beginPath();
  [[0,0,.28],[.25,-.12,.3],[.5,0,.26],[.25,.08,.3],[-.2,.04,.2],[.7,.05,.18]].forEach(([dx,dy,r])=>{c.moveTo(x+dx*w+r*w,y+dy*w);c.arc(x+dx*w,y+dy*w,r*w,0,Math.PI*2)});
  c.fill();c.globalAlpha=1;
}
function part(x,y,o){F.parts.push(Object.assign({x,y,vx:rnd(-120,120),vy:rnd(-160,40),life:1,decay:rnd(.8,1.4),size:rnd(4,9),color:'#fff',kind:'spark',rot:rnd(0,6)},o))}
function flyLoop(now){
  if(!F.on)return;
  const dt=Math.min(.05,(now-F.last)/1000);F.last=now;F.t+=dt;
  const {W,H,uw,uh}=F,c=F.ctx;
  // move unicorn
  F.tx=clamp(F.tx,uw*.5,W*.78);F.ty=clamp(F.ty,uh*.5+8,H-uh*.35);
  const px=F.ux,py=F.uy,k=Math.min(1,dt*5);
  F.ux+=(F.tx-F.ux)*k;F.uy+=(F.ty-F.uy)*k;
  const vy=(F.uy-py)/Math.max(dt,.001);
  // spawn
  F.spawn-=dt;if(F.spawn<=0){F.spawn=rnd(.65,1.2);F.stars.push({x:W+30,y:rnd(H*.15,H*.9),r:rnd(17,25),vx:-rnd(W*.12,W*.19),ph:rnd(0,6)})}
  F.cspawn-=dt;if(F.cspawn<=0){F.cspawn=rnd(2.6,4.5);F.clouds.push({x:W+120,y:rnd(H*.2,H*.85),w:rnd(90,140),vx:-W*.12,hit:0,sq:0})}
  // catch
  const hx=F.ux+uw*.12,hy=F.uy-uh*.05,hr=uw*.36;
  F.stars=F.stars.filter(s=>{
    s.x+=s.vx*dt;s.ph+=dt*3;const sy=s.y+Math.sin(s.ph)*10;
    if(Math.hypot(s.x-hx,sy-hy)<hr+s.r){catchStar(s.x,sy);return false}
    return s.x>-40;
  });
  F.clouds=F.clouds.filter(cl=>{
    cl.x+=cl.vx*dt;cl.sq=Math.max(0,cl.sq-dt*2);
    if(!cl.hit&&Math.hypot(cl.x+cl.w*.25-F.ux,cl.y-F.uy)<cl.w*.45+uw*.28){
      cl.hit=1;cl.sq=1;cl.vx*=.55;sfx.boing();
      for(let i=0;i<12;i++)part(cl.x+cl.w*.25,cl.y,{color:'#ffffff',size:rnd(8,16),kind:'puff',decay:rnd(1,1.6)});
      if(Math.random()<.5)speak(pick(['Boing!','Fluffy!','Soft cloud!']));
    }
    return cl.x>-cl.w*1.5;
  });
  // trail
  F.trail.push({x:F.ux-uw*.38,y:F.uy+uh*.02,life:1});
  F.trail.forEach(p=>{p.x-=W*.25*dt;p.life-=dt*1.6});F.trail=F.trail.filter(p=>p.life>0);
  F.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.kind==='confetti'?160:120)*dt;p.life-=p.decay*dt;p.rot+=dt*4});
  F.parts=F.parts.filter(p=>p.life>0&&p.y<H+40);
  F.bg.forEach(b=>{b.x-=W*b.s*dt;if(b.x<-b.w*1.2){b.x=W+b.w;b.y=rnd(H*.1,H*.8)}});
  if(F.cele>0){F.cele-=dt;if(Math.random()<.6)part(rnd(0,W),-10,{kind:'confetti',vx:rnd(-40,40),vy:rnd(40,120),color:pick(SKY7)[0],size:rnd(6,11),decay:.35});
    if(F.cele<=0){S.stripes=0;save()}}

  // draw
  c.setTransform(F.dpr,0,0,F.dpr,0,0);
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7cc8ff');g.addColorStop(.6,'#bfe6ff');g.addColorStop(1,'#ffe3f1');
  c.fillStyle=g;c.fillRect(0,0,W,H);
  F.bg.forEach(b=>drawCloud(c,b.x,b.y,b.w,.45));
  // rainbow
  const band=clamp(H*.03,10,22),R0=Math.min(W*.6,H*1.02),cx=W/2,cy=H*1.06;
  for(let i=0;i<7;i++){
    const r=R0-i*band-band/2;c.beginPath();c.arc(cx,cy,r,Math.PI,Math.PI*2);
    if(i<S.stripes){c.strokeStyle=SKY7[i][0];c.globalAlpha=F.cele>0?.75+.25*Math.sin(F.t*10+i):.85;c.lineWidth=band+1;c.setLineDash([])}
    else{c.strokeStyle='#ffffff';c.globalAlpha=.4;c.lineWidth=band*.35;c.setLineDash([2,band*.8])}
    c.stroke();c.globalAlpha=1;
  }
  c.setLineDash([]);
  // stars
  F.stars.forEach(s=>{const sy=s.y+Math.sin(s.ph)*10;c.shadowColor='#fff6b0';c.shadowBlur=16;drawStar(c,s.x,sy,s.r,s.ph*.3,'#ffd93d','#f2a91e');c.shadowBlur=0});
  // clouds (fg)
  F.clouds.forEach(cl=>{c.save();const q=1+cl.sq*.25;c.translate(cl.x,cl.y);c.scale(q,2-q);drawCloud(c,0,0,cl.w,.96);c.restore()});
  // trail
  F.trail.forEach((p,i)=>{c.globalAlpha=p.life*.8;c.fillStyle=SKY7[Math.floor(i/2)%7][0];c.beginPath();c.arc(p.x,p.y+Math.sin(i*.8+F.t*6)*3,band*.35*p.life+2,0,Math.PI*2);c.fill()});
  c.globalAlpha=1;
  // unicorn
  if(F.img.complete&&F.img.naturalWidth){
    c.save();c.translate(F.ux,F.uy+Math.sin(F.t*3)*4);c.rotate(clamp(vy*.0009,-.28,.28));
    c.drawImage(F.img,-uw/2,-uh/2,uw,uh);c.restore();
  }
  // particles
  F.parts.forEach(p=>{c.globalAlpha=Math.max(0,Math.min(1,p.life));
    if(p.kind==='star')drawStar(c,p.x,p.y,p.size,p.rot,p.color);
    else if(p.kind==='confetti'){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.color;c.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);c.restore()}
    else{c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,p.size,0,Math.PI*2);c.fill()}});
  c.globalAlpha=1;
  // HUD: progress toward next stripe
  const col=SKY7[Math.min(S.stripes,6)][0];
  for(let i=0;i<10;i++){const x=24+i*30,y=28;
    if(i<F.count)drawStar(c,x,y,12,0,'#ffd93d','#f2a91e');else drawStar(c,x,y,12,0,'rgba(255,255,255,.55)',col)}
  requestAnimationFrame(flyLoop);
}
function catchStar(x,y){
  sfx.chime(F.count);S.stars++;F.count++;S.needs.fun=clamp(S.needs.fun+2,0,100);
  for(let i=0;i<10;i++)part(x,y,{kind:i%2?'star':'spark',color:i%2?'#fff3a0':pick(SKY7)[0],size:i%2?rnd(5,9):rnd(3,6)});
  if(F.count>=10){
    F.count=0;
    if(F.cele>0)return save();
    S.stripes=Math.min(7,S.stripes+1);
    const [col,name]=SKY7[S.stripes-1];
    for(let i=0;i<30;i++)part(rnd(0,F.W),rnd(0,F.H*.4),{color:col,size:rnd(4,8),vy:rnd(-40,40)});
    if(S.stripes>=7){F.cele=6;S.rainbows++;setTimeout(sfx.fanfare,150);setTimeout(sfx.fanfare,900);
      speak(`You made a whole rainbow! Hooray, ${nm()}!`);}
    else{sfx.pick();speak(pick([`${name}!`,`${name}! Yay!`,`We got ${name}!`]))}
  }
  save();
}

/* ---------- modes ---------- */
function setMode(m){
  if(act){if(act.type==='sleep')wake(false);else endAct()}
  mode=m;stage.dataset.mode=m;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.m===m));
  $('#sceneMake').hidden=m!=='make';$('#sceneStable').hidden=m!=='stable';
  $('#needs').hidden=m!=='stable';$('#makePanel').hidden=m!=='make';$('#care').hidden=m!=='stable';
  $('#panel').hidden=m==='fly';UW.hidden=m==='fly';CV.hidden=m!=='fly';
  if(m==='fly')requestAnimationFrame(flyStart);else flyStop();
  eyes='open';drawUni();
  if(m==='make'){drawCats();drawOpts()}
  if(m==='stable'&&!S.made){S.made=true;save()}
  requestAnimationFrame(refreshNeeds);
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  unlock();const m=t.dataset.m;if(m===mode)return;t.classList.remove('nudge');sfx.chime(4);
  setMode(m);
  if(m==='make')speak(`Let's make ${nm()} even prettier!`);
  if(m==='stable')setTimeout(()=>{sfx.whinny();speak(pick([`Welcome home, ${nm()}!`,`${nm()} is home!`]))},50);
});

// slow need decay while playing
setInterval(()=>{
  const n=S.needs;n.food=clamp(n.food-.5,10,100);n.clean=clamp(n.clean-.3,10,100);n.fun=clamp(n.fun-.4,10,100);n.rest=clamp(n.rest-.25,10,100);
  save();if(mode==='stable')refreshNeeds();
},20000);
addEventListener('resize',()=>{if(mode==='fly'&&F.on)flySize();refreshNeeds()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* ---------- boot ---------- */
drawMute();
setMode(S.made?'stable':'make');
$('#go').onclick=()=>{
  unlock();$('#start').hidden=true;sfx.fanfare();
  setTimeout(()=>{sfx.whinny();speak(S.made?`Hi! ${nm()} missed you!`:`Hi! Let's make a unicorn! Pick a color.`)},500);
};
})();
</script>
